name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * *' # Setiap hari jam 08:00 UTC
  workflow_dispatch: # Manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.APP_URL }}/api/keep-alive?secret=${{ secrets.CRON_SECRET }}")
          echo "Response code: $RESPONSE"
          if [ "$RESPONSE" != "200" ]; then
            echo "Keep-alive failed with status $RESPONSE"
            exit 1
          fi
          echo "Keep-alive successful"
